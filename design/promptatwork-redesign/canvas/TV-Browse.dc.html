<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PromptAtWork TV — browse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#94a3b8;text-decoration:none}a:hover{color:#f8fafc}
input::placeholder{color:#94a3b8}
.side:hover{background:#222a3d;color:#f8fafc}
.chip{transition:background .15s}
.chip:hover{background:#31394d}
.vid .th{transition:border-radius .2s}
.vid:hover .th{border-radius:12px}
</style>
</helmet>
<div style="width: 1440px; height: 1120px; box-sizing: border-box; background: #0f172a; color: #f8fafc; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column">

<header style="height: 64px; flex-shrink: 0; display: grid; grid-template-columns: 240px 1fr 240px; align-items: center; padding: 0 16px; border-bottom: 1px solid #334155">
<div style="display: flex; align-items: center; gap: 12px">
<button aria-label="Menu" style="width: 40px; height: 40px; border-radius: 9999px; border: 0; background: transparent; color: #94a3b8; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
<a href="#" style="display: flex; align-items: center; gap: 8px; color: #f8fafc"><img src="../assets/logos/promptatwork-mark.png" alt="" style="width: 30px; height: 30px; border-radius: 8px"><span style="font-size: 16px; font-weight: 600">Prompt<span style="color: #4d8eff">AtWork</span></span></a>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: #d0bcff; border: 1px solid rgba(208,188,255,0.35); border-radius: 4px; padding: 0 4px; line-height: 16px">TV</span>
</div>
<div style="display: flex; justify-content: center">
<label style="display: flex; align-items: center; width: 640px; height: 44px; border-radius: 9999px; background: #334155">
<input placeholder="Search tutorials, bootcamps, notes" aria-label="Search" style="flex-grow: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: none; color: #f8fafc; font: 15px Geist, sans-serif; padding: 0 16px 0 20px">
<span style="height: 100%; width: 64px; display: grid; place-items: center; border-left: 1px solid #31394d; color: #f8fafc"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>
</label>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px">
<button aria-label="Notifications, 3 new" style="position: relative; width: 40px; height: 40px; border-radius: 9999px; border: 0; background: transparent; color: #94a3b8; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 4px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 9999px; background: #df7412; color: #311400; font: 500 10px/16px 'JetBrains Mono', monospace">3</span></button>
<img src="../assets/photos/niharika-headshot.jpg" alt="Your profile" style="width: 32px; height: 32px; border-radius: 9999px; object-fit: cover">
</div>
</header>

<div style="display: flex; flex-grow: 1; min-height: 0">
<nav aria-label="TV" style="width: 240px; flex-shrink: 0; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 2px">
<a href="#" style="display: flex; align-items: center; gap: 16px; height: 44px; padding: 0 12px; border-radius: 12px; background: #1e293b; box-shadow: inset 0 0 0 1px #334155; color: #f8fafc; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#adc6ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Home</a>
<a class="side" href="#" style="display: flex; align-items: center; gap: 16px; height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>Shorts</a>
<a class="side" href="#" style="display: flex; align-items: center; gap: 16px; height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12H3"></path><path d="M16 6H3"></path><path d="M12 18H3"></path><path d="m16 12 5 3-5 3v-6Z"></path></svg>Playlists</a>
<a class="side" href="#" style="display: flex; align-items: center; gap: 16px; height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6"></path><path d="M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>AI Bootcamps</a>
<a class="side" href="#" style="display: flex; align-items: center; gap: 16px; height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path></svg>Library</a>
</nav>

<main style="flex-grow: 1; min-width: 0; padding: 0 24px 40px">
<div role="tablist" aria-label="Topics" style="display: flex; gap: 8px; padding: 12px 0 20px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
<button class="chip" role="tab" aria-selected="{{ c.selected }}" onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 16px">
<sc-for list="{{ videos }}" as="v" hint-placeholder-count="12">
<article class="vid" style="display: flex; flex-direction: column; gap: 12px; cursor: pointer">
<div class="th" style="{{ v.thumbStyle }}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: rgba(248,250,252,0.75)">{{ v.kicker }}</span>
<span style="font-size: 22px; line-height: 24px; font-weight: 600; letter-spacing: -0.02em; max-width: 80%">{{ v.word }}</span>
<span style="position: absolute; right: 8px; bottom: 8px; padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,0.8); color: #ffffff; font: 500 11px/16px 'JetBrains Mono', monospace">{{ v.dur }}</span>
</div>
<div style="display: flex; gap: 12px; align-items: flex-start">
<img src="../assets/photos/niharika-headshot.jpg" alt="Niharika Dhande" style="width: 36px; height: 36px; border-radius: 9999px; object-fit: cover; flex-shrink: 0">
<div>
<h3 style="margin: 0 0 4px; font-size: 16px; line-height: 22px; font-weight: 600; color: #f8fafc">{{ v.title }}</h3>
<div style="font-size: 13px; line-height: 18px; color: #94a3b8">Niharika Dhande</div>
<div style="font-size: 13px; line-height: 18px; color: #94a3b8">{{ v.views }} views · {{ v.when }}</div>
</div>
</div>
</article>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { topic: 'All' }; }
  renderVals() {
    var bgs = {
      blue: 'radial-gradient(120% 90% at 85% 10%, #3b82f6, transparent 60%), radial-gradient(90% 80% at 0% 100%, #571bc1, transparent 70%), #060e20',
      violet: 'radial-gradient(110% 90% at 90% 90%, #8b5cf6, transparent 60%), radial-gradient(70% 70% at 10% 0%, #004395, transparent 70%), #060e20',
      warm: 'radial-gradient(110% 100% at 100% 0%, #df7412, transparent 58%), radial-gradient(80% 80% at 0% 100%, #5516be, transparent 70%), #060e20',
      teal: 'radial-gradient(120% 90% at 0% 0%, #4d8eff, transparent 55%), radial-gradient(90% 90% at 100% 100%, #723600, transparent 65%), #060e20',
      mono: 'radial-gradient(100% 100% at 50% 120%, #31394d, transparent 70%), #060e20'
    };
    var all = [
      ['warm','PART 1','Survival guide to the AI era','[DUR]','The Engineer’s Survival Guide to the AI Era — Part 1: Why BMad Changes Everything','[N]','[DATE]','Agentic AI'],
      ['blue','RAG · PART 1','Chunking that works','14:20','RAG from scratch: chunking, embeddings and retrieval','12K','3 days ago','RAG'],
      ['violet','AGENTIC AI','Agents that plan','22:05','Build a planning agent with LangChain and tools','8.4K','1 week ago','Agentic AI'],
      ['warm','PROMPTING','Few-shot vs CoT','9:48','Few-shot vs chain-of-thought: when each one wins','31K','2 weeks ago','Prompt Engineering'],
      ['teal','MCP','Your first MCP server','18:32','Write your first MCP server and connect it to Claude','5.1K','2 weeks ago','Agentic AI'],
      ['mono','N8N','Inbox → CRM','12:10','n8n + LLM: auto-triage your inbox into a CRM','19K','3 weeks ago','Agentic AI'],
      ['violet','BOOTCAMP · DAY 1','Agentic RAG','1:02:44','AI Bootcamp Day 1 — agentic RAG end to end (full session)','4.7K','1 month ago','RAG'],
      ['blue','EVALUATION','Eval your RAG','16:03','How to evaluate a RAG pipeline (without guessing)','7.9K','1 month ago','RAG'],
      ['warm','PROMPTING','System prompts','11:27','System prompts that survive real users','26K','1 month ago','Prompt Engineering'],
      ['teal','CONTEXT','Context engineering','20:15','Context engineering: what goes in the window, and why','15K','2 months ago','Prompt Engineering'],
      ['mono','AGENTIC AI','Tool calling 101','8:56','Tool calling explained in nine minutes','42K','2 months ago','Agentic AI'],
      ['violet','RAG · PART 2','Hybrid search','17:40','Hybrid search and re-ranking for better retrieval','9.3K','3 months ago','RAG'],
      ['blue','WORKFLOW','Claude Code daily','13:05','My daily Claude Code workflow for shipping faster','58K','3 months ago','Prompt Engineering']
    ];
    var topic = this.state.topic;
    var videos = all.filter(function (r) { return topic === 'All' || r[7] === topic; }).map(function (r) {
      return { thumbStyle: 'position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: ' + bgs[r[0]] + '; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px 16px; box-sizing: border-box',
        kicker: r[1], word: r[2], dur: r[3], title: r[4], views: r[5], when: r[6] };
    });
    var self = this;
    var chips = ['All', 'RAG', 'Agentic AI', 'Prompt Engineering'].map(function (label) {
      var on = label === topic;
      return { label: label, selected: on ? 'true' : 'false',
        style: 'height: 32px; padding: 0 14px; border-radius: 8px; border: 0; cursor: pointer; font: 500 14px Geist, sans-serif; white-space: nowrap; ' + (on ? 'background: #f8fafc; color: #0f172a' : 'background: #334155; color: #f8fafc'),
        pick: function () { self.setState({ topic: label }); } };
    });
    return { chips: chips, videos: videos };
  }
}
</script>
</body>
</html>
